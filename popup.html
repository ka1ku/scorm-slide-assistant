<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        width: 240px;
        margin: 0;
        padding: 14px 16px;
        color: #1a1a1a;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 12px;
        font-weight: 600;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      label {
        font-size: 13px;
      }
      input[type='range'] {
        width: 100%;
      }
      .speed-val {
        font-variant-numeric: tabular-nums;
        font-weight: 600;
        color: #00843d;
      }
      .switch {
        position: relative;
        width: 36px;
        height: 20px;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        inset: 0;
        cursor: pointer;
        background: #ccc;
        border-radius: 20px;
        transition: 0.2s;
      }
      .slider::before {
        content: '';
        position: absolute;
        width: 16px;
        height: 16px;
        left: 2px;
        top: 2px;
        background: #fff;
        border-radius: 50%;
        transition: 0.2s;
      }
      input:checked + .slider {
        background: #00843d;
      }
      input:checked + .slider::before {
        transform: translateX(16px);
      }
      .hint {
        font-size: 11px;
        color: #666;
        line-height: 1.45;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <h1>SCORM Slide Assistant</h1>
    <div class="row">
      <label for="enabled">Auto-advance</label>
      <label class="switch">
        <input type="checkbox" id="enabled" />
        <span class="slider"></span>
      </label>
    </div>
    <div class="row">
      <label for="speed">Playback speed</label>
      <span class="speed-val" id="speed-val">2×</span>
    </div>
    <input type="range" id="speed" min="0.5" max="2" step="0.25" />
    <p class="hint">
      Quizzes are not auto-submitted. Background-tab helper keeps many players
      from pausing when you switch tabs (browser limits may still apply).
    </p>
    <script src="popup.js"></script>
  </body>
</html>
